name: Hook and Script Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install jsonschema pyyaml

      - name: Run Bash hook fixture tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          bash tests/hooks/test-enforce-append-only.sh
          bash tests/hooks/test-enforce-reversibility.sh
          bash tests/hooks/test-log-tool-call.sh
          bash tests/hooks/test-rotate-audit-log.sh

      - name: Run PowerShell hook fixture tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Run every test and fail the step if any of them fails. A bare list of
          # pwsh lines fails the step only on the last one: a native command's
          # exit code does not trigger $ErrorActionPreference.
          $failed = @()
          foreach ($t in 'test-enforce-append-only', 'test-enforce-reversibility', 'test-log-tool-call', 'test-rotate-audit-log') {
            pwsh "tests/hooks/win/$t.ps1"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) { Write-Host ("FAILED: " + ($failed -join ', ')); exit 1 }

      - name: Run Python rotation fixture test
        run: python tests/hooks/test-rotate-audit-log.py

      - name: Run schema fixture suite (valid/invalid)
        run: python tests/test-schema-fixtures.py

      - name: Check the plugin manifest loads in current Claude Code
        run: python tests/test-plugin-manifest.py

      - name: Run Python projection-cost test
        run: python tests/scripts/test-measure-projection-cost.py

      - name: Run kickoff template schema-validation test
        run: python tests/test-kickoff-templates.py

      - name: Measure projection cost (advisory)
        run: python scripts/measure-projection-cost.py --ci

      - name: Run Stage 4 pattern_type routing consistency test
        run: python tests/test-stage4-routing.py

      - name: Validate CI YAML (self-check)
        run: |
          python -c "
          import pathlib, sys
          text = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          errors = []
          if 'ubuntu-latest' not in text:
              errors.append('CI YAML: missing ubuntu-latest platform')
          if 'windows-latest' not in text:
              errors.append('CI YAML: missing windows-latest platform')
          try:
              import yaml
              yaml.safe_load(text)
          except Exception as e:
              errors.append(f'CI YAML parse error: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print('CI YAML VALID')
          "
