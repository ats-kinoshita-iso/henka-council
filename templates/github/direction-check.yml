# Installed by /henkaten-council:council-kickoff into the target repo as
# .github/workflows/direction-check.yml. Runs the Layer A deterministic
# direction check on every push / PR and posts a status check. Layer B (the
# semantic judge) runs in-session in the council, not in CI.
name: Direction Check (Layer A)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  direction-check:
    name: direction-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run direction-check (Layer A, CI mode)
        shell: bash
        run: |
          set -uo pipefail
          # The plugin vendors direction-check.py; resolve it wherever it lives.
          SCRIPT=$(ls scripts/direction-check.py .council/scripts/direction-check.py 2>/dev/null | head -1 || true)
          if [ -z "$SCRIPT" ]; then
            echo "::notice::direction-check.py not vendored in this repo; skipping."
            exit 0
          fi
          # direction-check.py exits 0 (PASS) unless .council/config.json sets
          # direction_check.enabled: true, so a repo with the gate off is never blocked.
          # --auto-contract resolves .harness/contracts/sprint-{NN}.md so the
          # killed-workstream check runs in CI.
          # --charters-dir picks the charter whose "branch" matches (else
          # branch-<slug>.json).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ARGS=(--config .council/config.json --branch "$BRANCH" --charters-dir .council/charters --root . --auto-contract --ci)
          if [ -f .harness/spec.md ]; then ARGS+=(--spec .harness/spec.md); fi
          # shell: bash runs with -e, so capture the exit code without letting
          # a non-zero WARN (10) end the step before the tier logic.
          rc=0
          python "$SCRIPT" "${ARGS[@]}" || rc=$?
          # Exit tiers: 0 PASS, 10 WARN, 20 BLOCK. Fail the check only on BLOCK.
          if [ "$rc" -ge 20 ]; then exit 1; fi
          exit 0
